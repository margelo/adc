[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-device-cloud-cli"
version = "0.3.0"
description = "CLI and MCP client for Cloud Devices"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "websockets==17.4",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
adc = "clients.cli:main"
adc-mcp = "clients.mcp_server:main"

[tool.setuptools]
packages = ["clients"]

name: Agent Device Cloud
description: Provision an Android device, run a command through ADB and release it
inputs:
  api-url:
    description: Optional HTTPS API origin override; otherwise uses the client's default
    required: false
  api-key:
    description: Account API key stored in GitHub Actions secrets
    required: true
  command:
    description: Command to run with ANDROID_SERIAL set to the connected device
    required: true
  name:
    description: Lease name
    default: GitHub Actions
  form-factor:
    description: Optional device form factor from adc device-options (phone or tv)
    required: false
  api-level:
    description: Optional Android API level from adc device-options
    required: false
  width:
    description: Optional display width in pixels
    required: false
  height:
    description: Optional display height in pixels
    required: false
  dpi:
    description: Optional display density in DPI
    required: false
  provision-timeout-seconds:
    description: Maximum wait for a newly bootstrapped cloud device
    default: '600'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install Device Cloud client
      shell: bash
      env:
        ADC_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ADC_ACTION_PATH"
    - name: Run with a fresh Android device
      shell: bash
      env:
        ADC_API_URL: ${{ inputs.api-url }}
        ADC_API_KEY: ${{ inputs.api-key }}
        ADC_COMMAND: ${{ inputs.command }}
        ADC_NAME: ${{ inputs.name }}
        ADC_FORM_FACTOR: ${{ inputs.form-factor }}
        ADC_API_LEVEL: ${{ inputs.api-level }}
        ADC_WIDTH: ${{ inputs.width }}
        ADC_HEIGHT: ${{ inputs.height }}
        ADC_DPI: ${{ inputs.dpi }}
        ADC_TIMEOUT: ${{ inputs.provision-timeout-seconds }}
      run: |
        command -v adb >/dev/null || { echo 'Install Android platform-tools before using this action.' >&2; exit 1; }
        adc_args=(--name "$ADC_NAME" --purpose ci --timeout "$ADC_TIMEOUT")
        if [[ -n "$ADC_FORM_FACTOR" ]]; then
          adc_args+=(--form-factor="$ADC_FORM_FACTOR")
        fi
        if [[ -n "$ADC_API_LEVEL" ]]; then
          adc_args+=(--api-level="$ADC_API_LEVEL")
        fi
        if [[ -n "$ADC_WIDTH" ]]; then
          adc_args+=(--width="$ADC_WIDTH")
        fi
        if [[ -n "$ADC_HEIGHT" ]]; then
          adc_args+=(--height="$ADC_HEIGHT")
        fi
        if [[ -n "$ADC_DPI" ]]; then
          adc_args+=(--dpi="$ADC_DPI")
        fi
        adc run "${adc_args[@]}" -- bash -euc "$ADC_COMMAND"
